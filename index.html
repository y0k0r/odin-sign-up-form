<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign-up Form</title>
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>

    <div class="left-container">
      <div class="logo-wrapper">
        <img src="./img/odin-lined.png" alt="Odin Project Logo">
        <h1>ODIN</h1>
      </div>
      <p class="attribution">Photo by <a href="https://unsplash.com/@haliewestphoto?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash">Halie West</a> on <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash">Unsplash</a>
      </p>
    </div> 

    <div class="right-container">
      <section class="main">
        <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</p>
        <p>You <em>know</em> you want to.</p>
      </section>

      <form method="post" class="signup-form">

        <fieldset>
          <legend>Let's do this!</legend>
          
          <div class="form-field">
            <label for="first-name">FIRST NAME</label>
            <input type="text" name="first-name" id="first-name"> 
          </div>
          
          <div class="form-field">
            <label for="last-name">LAST NAME</label>
            <input type="text" name="last-name" id="last-name">
          </div>

          <div class="form-field">
            <label for="email">EMAIL</label>
            <input type="email" name="email" id="email">
          </div>

          <div class="form-field">
            <label for="phone">PHONE NUMBER</label>
            <input type="tel" name="phone" id="phone">
          </div>

          <div class="form-field">
            <label for="pwd">PASSWORD</label>
            <input type="password" name="password" id="pwd" min-length="8" required>
          </div>

          <div class="form-field">
            <label for="confirm-password">CONFIRM PASSWORD</label>
            <input type="password" name="confirm-password" id="confirm-password" min-length="8" required>
          </div>

        </fieldset>

        <button type="submit">Create Account</button>
      </form>

      <p class="log-in">Already have an account? <a href="#">Log in</a></p>

    </div> 
  </body>
</html>
